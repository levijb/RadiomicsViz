[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "radiomicsviz"
version = "0.3.0.dev0"
description = "Stage-wise, manifest-driven MRI radiomics pipeline with habitat analysis and automatic quality control."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Private :: Do Not Upload",
]
dependencies = [
    "click>=8.1,<9",
    "numpy>=1.26,<2",
    "pykwalify==1.8.0",
    "pyradiomics==3.0.1",
    "PyWavelets==1.8.0",
    "PyYAML>=6.0,<7",
    "scipy>=1.11,<1.12",
    "six>=1.17,<2",
    "SimpleITK>=2.5,<2.6",
    "trimesh>=5.2,<5.3",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
radiomicviz = "radiomicviz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/radiomicviz"]

[tool.hatch.build.targets.sdist]
include = [
    "src/radiomicviz",
    "scripts",
    "tests",
    "environment.yml",
    "README.md",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
