# Reproducible analysis environment for the reference 32-bin workflow.
# PyRadiomics is installed by scripts/create_environment.sh after this file because
# version 3.0.1 must be installed without build isolation and without dependency changes.
name: radiomicviz-validation-v1
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.10
  - pip
  - pip:
      - setuptools==82.0.1
      - wheel==0.46.3
      - hatchling==1.33.0
      - numpy==1.26.4
      - SimpleITK==2.5.5
      - PyWavelets==1.8.0
      - scipy==1.11.4
      - scikit-learn==1.1.3
      - pandas==2.3.3
      - nibabel==5.4.2
      - pynrrd==1.1.3
      - trimesh==5.2.0
      - pykwalify==1.8.0
      - six==1.17.0
      - python-dateutil==2.9.0.post0
      - docopt==0.6.2
      - ruamel.yaml==0.19.1
      - joblib==1.6.0
      - threadpoolctl==3.7.0
      - click==8.5.0
      - PyYAML==6.0.3
      - pytest==9.2.0
